name: daily-watch
on:
  schedule:
    - cron: "30 5 * * *"   # 09:30 Mauritius (UTC+4) - before the 10:00 report and 10:15 x402 run
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: [watch.py, .github/workflows/watch.yml]   # test run when the watch list changes
permissions:
  contents: write
concurrency: watch
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check watched items
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 watch.py
      - name: Save state and report
        if: always()
        run: |
          git config user.name "github-watch"
          git config user.email "github-watch@users.noreply.github.com"
          git add -A
          git commit -m "watch: $(date -u +%FT%TZ)" || echo "nothing to commit"
          git push
